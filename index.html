<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter Dandelion V4</title>
    <meta name="poster-version" content="V4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css?v=V4" />
  </head>
  <body>
    <main class="viewport">
      <section class="frame-shell">
        <div id="poster"></div>

        <section class="message-panel is-hidden" id="message-panel">
          <p class="message-author" id="message-author"></p>
          <p class="message-text" id="message-text"></p>
          <button class="message-button" id="release-button" type="button">
            收下
          </button>
        </section>

        <section class="ending-panel is-hidden" id="ending-panel">
          <p>花瓣已经读完了，风会替我们把话带远。</p>
        </section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="./sketch.js?v=V4"></script>
  </body>
</html>
